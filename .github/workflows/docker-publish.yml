name: Build & Push Docker Image

on:
  push:
    branches:
      - release
  # Pushes to a freshly created repo sometimes start no run (development/learnings/ci-and-releases.md).
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # ⚠️ The gate. A push to `release` is the whole deploy: Watchtower on the NAS
  # recreates the container from `:latest` within ~5 minutes, unattended. So a red
  # check here must publish nothing. Reuses ci.yml rather than restating it.
  verify:
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  build-and-push:
    needs: verify
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          # `latest` is what the NAS follows; the commit SHA is there to roll back to.
          tags: |
            type=sha,prefix=
            type=raw,value=latest

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          # Both, so the image runs whatever CPU the NAS has.
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
